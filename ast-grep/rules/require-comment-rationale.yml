id: require-comment-rationale
language: TypeScript
severity: error
message: Delete this comment, or prefix it with a rationale marker (WHY:, SAFETY:, INVARIANT:, HACK:) followed by the reason.
rule:
  kind: comment
  not:
    any:
      - regex: '^(//|/\*)\s*(\*/)?$'
      - regex: '^/\*\*'
      - regex: '^///\s*<(reference|amd-)'
      - regex: "eslint-disable|eslint-enable|oxlint-disable|oxlint-enable|prettier-ignore|oxfmt-ignore"
      - regex: "@ts-expect-error|@ts-ignore|@ts-nocheck|@ts-check"
      - regex: "WHY:|SAFETY:|INVARIANT:|HACK:|TODO|FIXME"
