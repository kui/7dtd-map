id: require-comment-rationale
valid:
  - "// WHY: upstream schema drift, see #123\nconst x = 1;"
  - "// SAFETY: caller guarantees non-null\nconst x = 1;"
  - "// INVARIANT: array stays sorted by id, do not push out of order\nconst xs = [];"
  - "// HACK: workaround for upstream bug 1234\nconst x = 1;"
  - "// TODO: refactor later\nconst x = 1;"
  - "// deno-lint-ignore no-explicit-any -- external boundary\nconst x: any = 1;"
  - "/** JSDoc-style summary */\nexport function f() {}"
  - "/// <reference lib=\"deno.ns\" />\nconst x = 1;"
  - "// @ts-expect-error external types are wrong\nconst x = 1;"
  - "//\nconst x = 1;"
invalid:
  - "// this restates the code\nconst x = 1;"
  - "/* explains nothing */\nconst x = 1;"
  - "// NOTE: nothing to see here\nconst x = 1;"
  - "// IMPORTANT: read this\nconst x = 1;"
  - "// KEEP: no reason\nconst x = 1;"
  - "/// plain triple slash\nconst x = 1;"
